name: Verify Exact Level 3

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: Exact uncompressed candidate SHA256
        required: true
        type: string
      expected_base:
        description: Exact authoritative Cerebro Source baseline commit
        required: true
        type: string
      payload_gzip_base64url:
        description: GZIP + BASE64URL sealed Level-3 payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022

    steps:
      - name: Checkout authoritative baseline
        uses: actions/checkout@v4
        with:
          repository: morgul-tech/Cerebro-Source-1.0
          ref: ${{ inputs.expected_base }}
          fetch-depth: 0
          path: fixture

      - name: Reconstruct and verify exact Level 3 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedHash = '${{ inputs.expected_sha256 }}'.Trim().ToLowerInvariant()
          $baseline = '${{ inputs.expected_base }}'.Trim().ToLowerInvariant()

          if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
            throw 'EXPECTED_SHA256_INVALID'
          }

          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            throw 'EXPECTED_BASE_INVALID'
          }

          $token = '${{ inputs.payload_gzip_base64url }}'
          $token = ($token -replace '\s', '').Trim()

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'BASE64URL_EMPTY'
          }

          if ($token -notmatch '^[A-Za-z0-9_-]+$') {
            throw 'BASE64URL_INVALID_CHARACTERS'
          }

          $base64 = $token.Replace('-', '+').Replace('_', '/')

          switch ($base64.Length % 4) {
            0 { }
            2 { $base64 += '==' }
            3 { $base64 += '=' }
            default { throw 'BASE64URL_INVALID_LENGTH' }
          }

          try {
            $compressed = [Convert]::FromBase64String($base64)
          }
          catch {
            throw "BASE64URL_DECODE_FAILED:$($_.Exception.Message)"
          }

          $roundTrip = [Convert]::ToBase64String($compressed).
            TrimEnd('=').
            Replace('+', '-').
            Replace('/', '_')

          if ($roundTrip -cne $token) {
            throw 'BASE64URL_ROUNDTRIP_MISMATCH'
          }

          $inputStream = [IO.MemoryStream]::new($compressed)
          $gzip = [IO.Compression.GZipStream]::new(
            $inputStream,
            [IO.Compression.CompressionMode]::Decompress
          )
          $outputStream = [IO.MemoryStream]::new()

          try {
            $gzip.CopyTo($outputStream)
            $candidateBytes = $outputStream.ToArray()
          }
          catch {
            throw "GZIP_DECOMPRESS_FAILED:$($_.Exception.Message)"
          }
          finally {
            $gzip.Dispose()
            $inputStream.Dispose()
            $outputStream.Dispose()
          }

          $candidate = Join-Path $PWD 'candidate.ps1'
          [IO.File]::WriteAllBytes($candidate, $candidateBytes)

          $actualHash = (
            Get-FileHash $candidate -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($actualHash -ne $expectedHash) {
            throw "HASH_MISMATCH:$actualHash"
          }

          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
            $candidate,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -ne 0) {
            throw ('PARSE_FAILED:' + ($errors.Message -join ' | '))
          }

          $runtimeVersion = (
            & powershell.exe -NoLogo -NoProfile `
              -Command '$PSVersionTable.PSVersion.ToString()' 2>&1 |
              Out-String
          ).Trim()

          $runtimeExit = $LASTEXITCODE

          if ($runtimeExit -ne 0) {
            throw 'WINDOWS_POWERSHELL_RUNTIME_UNAVAILABLE'
          }

          if ($runtimeVersion -notmatch '^5\.1\.') {
            throw "WINDOWS_POWERSHELL_RUNTIME_MISMATCH:$runtimeVersion"
          }

          $fixture = Join-Path $PWD 'fixture'

          function Reset-Fixture {
            git -C $fixture reset --hard $baseline | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'RESET_FAILED' }

            git -C $fixture clean -fd | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'CLEAN_FAILED' }

            git -C $fixture checkout -B main $baseline | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'BRANCH_RESET_FAILED' }
          }

          function Invoke-Candidate {
            $output = & powershell.exe `
              -NoLogo `
              -NoProfile `
              -ExecutionPolicy Bypass `
              -File $candidate `
              -RepoPath $fixture `
              -ExpectedBranch main `
              -ExpectedBase $baseline 2>&1

            $code = $LASTEXITCODE

            [pscustomobject]@{
              ExitCode = $code
              Output   = ($output -join "`n")
            }
          }

          $result = [ordered]@{
            verifier                  = 'CEREBRO-EXACT-L3-006'
            transport                 = 'GZIP_BASE64URL_NOPAD'
            verifier_engine           = $PSVersionTable.PSEdition
            verifier_version          = $PSVersionTable.PSVersion.ToString()
            candidate_runtime         = 'Windows PowerShell'
            candidate_runtime_version = $runtimeVersion
            baseline                  = $baseline
            candidate_sha256          = $actualHash
            transport_roundtrip       = $true
            transport_reconstructed   = $true
            parser                    = $true
            success                   = $false
            dirty_tree                = $false
            wrong_branch              = $false
            wrong_baseline            = $false
            rollback                  = $false
            duplicate_execution       = $false
            overall                   = 'FAIL'
          }

          Reset-Fixture
          $success = Invoke-Candidate

          if ($success.ExitCode -ne 0) {
            throw "SUCCESS_SCENARIO_FAILED:$($success.Output)"
          }

          $successReceipt = $success.Output | ConvertFrom-Json

          if (
            $successReceipt.state -ne 'PASS' -or
            -not $successReceipt.validation
          ) {
            throw 'SUCCESS_RECEIPT_INVALID'
          }

          $result.success = $true

          Reset-Fixture
          Set-Content (Join-Path $fixture 'dirty.tmp') 'dirty'
          $dirty = Invoke-Candidate
          $result.dirty_tree = ($dirty.ExitCode -ne 0)

          Reset-Fixture
          git -C $fixture checkout --detach $baseline | Out-Null
          $wrongBranch = Invoke-Candidate
          $result.wrong_branch = ($wrongBranch.ExitCode -ne 0)

          Reset-Fixture
          git -C $fixture config user.email 'verifier@cerebro.invalid'
          git -C $fixture config user.name 'Cerebro Verifier'
          Set-Content (Join-Path $fixture 'baseline.tmp') 'different'
          git -C $fixture add baseline.tmp
          git -C $fixture commit -m 'wrong baseline canary' | Out-Null

          $wrongBaseline = Invoke-Candidate
          $result.wrong_baseline = ($wrongBaseline.ExitCode -ne 0)

          Reset-Fixture
          $env:CEREBRO_VERIFIER_FAULT_AFTER_WRITE = '1'
          $rollback = Invoke-Candidate
          Remove-Item Env:CEREBRO_VERIFIER_FAULT_AFTER_WRITE

          $rollbackState = @(git -C $fixture status --porcelain)
          $rollbackStateExit = $LASTEXITCODE
          $rollbackHead = @(git -C $fixture rev-parse --verify HEAD)
          $rollbackHeadExit = $LASTEXITCODE

          $result.rollback =
            ($rollback.ExitCode -ne 0) -and
            ($rollbackStateExit -eq 0) -and
            ($rollbackState.Count -eq 0) -and
            ($rollbackHeadExit -eq 0) -and
            ($rollbackHead.Count -eq 1) -and
            ($rollbackHead[0].Trim().ToLowerInvariant() -eq $baseline)

          Reset-Fixture
          $first = Invoke-Candidate

          if ($first.ExitCode -ne 0) {
            throw 'DUPLICATE_SETUP_FAILED'
          }

          $second = Invoke-Candidate
          $result.duplicate_execution = ($second.ExitCode -ne 0)

          $checks = @(
            $result.transport_roundtrip
            $result.transport_reconstructed
            $result.parser
            $result.success
            $result.dirty_tree
            $result.wrong_branch
            $result.wrong_baseline
            $result.rollback
            $result.duplicate_execution
          )

          if ($checks -notcontains $false) {
            $result.overall = 'PASS'
          }

          $result |
            ConvertTo-Json -Depth 6 |
            Tee-Object exact-level3-receipt.json

          if ($result.overall -ne 'PASS') {
            exit 1
          }

          exit 0

      - name: Upload verifier receipt
        uses: actions/upload-artifact@v4
        with:
          name: exact-level3-receipt
          path: exact-level3-receipt.json
